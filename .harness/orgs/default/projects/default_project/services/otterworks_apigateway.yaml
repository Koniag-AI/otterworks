service:
  name: otterworks_api-gateway
  identifier: otterworks_apigateway
  orgIdentifier: default
  projectIdentifier: default_project
  serviceDefinition:
    spec:
      manifests:
        - manifest:
            identifier: api_gateway
            type: HelmChart
            spec:
              store:
                type: Github
                spec:
                  connectorRef: KGS_AI_Github
                  gitFetchType: Branch
                  folderPath: infrastructure/helm/api-gateway
                  repoName: otterworks
                  branch: main
              subChartPath: ""
              optionalValuesYaml: false
              skipResourceVersioning: false
              enableDeclarativeRollback: false
              helmVersion: V3
              fetchHelmChartMetadata: false
    type: NativeHelm
