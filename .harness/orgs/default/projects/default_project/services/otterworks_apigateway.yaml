service:
  name: otterworks_api-gateway
  identifier: otterworks_apigateway
  orgIdentifier: default
  projectIdentifier: default_project
  serviceDefinition:
    spec:
      manifests:
        - manifest:
            identifier: api_gateway
            type: HelmChart
            spec:
              store:
                type: Github
                spec:
                  connectorRef: KGS_AI_Github
                  gitFetchType: Branch
                  folderPath: infrastructure/helm/api-gateway
                  repoName: otterworks
                  branch: main
              subChartPath: ""
              valuesPaths:
                - infrastructure/helm/api-gateway/values.yaml
              optionalValuesYaml: false
              skipResourceVersioning: false
              enableDeclarativeRollback: false
              helmVersion: V3
              fetchHelmChartMetadata: false
      artifacts:
        primary:
          primaryArtifactRef: <+input>
          sources:
            - spec:
                connectorRef: KGS_AWS_ALERT_environment
                imagePath: otterworks/api-gateway
                tag: latest
                digest: ""
                region: us-east-1
              identifier: api_gateway
              type: Ecr
    type: NativeHelm
