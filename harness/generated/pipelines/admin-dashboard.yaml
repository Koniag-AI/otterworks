pipeline:
  name: Build and Deploy Admin Dashboard
  identifier: Build_and_Deploy_admin_dashboard
  projectIdentifier: default_project
  orgIdentifier: default
  tags:
    application: admin-dashboard
  template:
    templateRef: Otterworks_Build_Deploy_Template
    versionLabel: v2
    templateInputs:
      properties:
        ci:
          codebase:
            connectorRef: KGS_AI_Github
            repoName: otterworks
            build: <+input>
      variables:
      - name: servicenow_incident_number
        type: String
        value: <+input>.default("")
      - name: aws_connector
        type: String
        value: <+input>.default("KGS_AWS_ALERT_environment")
      - name: aws_account_id
        type: String
        value: <+input>.default("178707646889")
      - name: aws_region
        type: String
        value: <+input>.default("us-east-1")
      - name: ecr_image_path
        type: String
        value: otterworks/admin-dashboard
      - name: service_workspace
        type: String
        value: ./frontend/admin-dashboard
      - name: build_context
        type: String
        value: ./frontend/admin-dashboard
      - name: dockerfile_path
        type: String
        value: ./frontend/admin-dashboard/Dockerfile
      - name: build_image
        type: String
        value: node:20
      - name: sonar_project_key
        type: String
        value: <+input>.default("Koniag-gs")
      - name: delegate_selector
        type: String
        value: <+input>.default("terraform-delegate")
      - name: servicenow_connector
        type: String
        value: <+input>.default("koniaggovernmentservicesllcdemo1")
      - name: build_command
        type: String
        value: npm ci && npm run build
      - name: test_command
        type: String
        value: npm ci && npm test -- --watch=false --browsers=ChromeHeadless
      - name: static_analysis_command
        type: String
        value: npm ci && npm run lint
      - name: test_intelligence
        type: String
        value: 'false'
      stages:
      - stage:
          identifier: Provision_Infra
          type: IACM
          spec:
            workspace: koniagcognitionharnessworkspace
      - stage:
          identifier: Deploy_to_Dev
          type: Deployment
          spec:
            service:
              serviceRef: otterworks_admindashboard
              serviceInputs:
                serviceDefinition:
                  type: NativeHelm
                  spec:
                    artifacts:
                      primary:
                        primaryArtifactRef: admin_dashboard
            environment:
              environmentRef: alert_dev
              gitBranch: harness-dev-env-patch
              infrastructureDefinitions:
              - identifier: alertdevinfra_nativehelm
