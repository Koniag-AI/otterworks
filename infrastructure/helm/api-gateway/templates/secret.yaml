{{- /*
JWT signing secret for the API Gateway. The gateway fails to start if
JWT_SECRET is empty (see internal/config Validate), so the chart always
provisions one:
  - use .Values.jwtSecret when provided (e.g. from a Harness secret),
  - otherwise reuse the value already stored in the cluster,
  - otherwise generate a new random value on first install.
This keeps the secret out of source control while guaranteeing the pod
always has a value and the value stays stable across upgrades.
*/}}
{{- $secretName := printf "%s-secrets" .Release.Name -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $jwt := "" -}}
{{- if .Values.jwtSecret -}}
{{-   $jwt = .Values.jwtSecret -}}
{{- else if and $existing $existing.data (index $existing.data "JWT_SECRET") -}}
{{-   $jwt = index $existing.data "JWT_SECRET" | b64dec -}}
{{- else -}}
{{-   $jwt = randAlphaNum 48 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
data:
  JWT_SECRET: {{ $jwt | b64enc | quote }}
